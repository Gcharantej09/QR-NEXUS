<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us · QR Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="citizen.css">
<style>
.contact-card{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--cit-line-2);border-radius:20px;padding:32px;box-shadow:0 8px 28px rgba(0,0,0,0.06);}
.contact-card h2{font-size:1.5rem;margin-bottom:18px;color:var(--cit-text);display:flex;align-items:center;gap:10px;font-family:var(--font-display);}
.contact-card h2 i{color:var(--cit-saffron);}
.info-row{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--cit-line-2);border-radius:12px;margin-bottom:10px;background:var(--cit-bg-2);transition:all var(--t) var(--ease);}
.info-row:hover{background:rgba(255,107,0,0.06);border-color:rgba(255,107,0,0.30);transform:translateY(-2px);}
.info-row .ico{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--cit-saffron),#FF8C42);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;box-shadow:0 4px 10px rgba(255,107,0,0.25);}
.info-row .body{flex:1;}
.info-row label{font-size:0.7rem;color:var(--cit-mute);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;display:block;margin-bottom:2px;}
.info-row span{font-size:0.92rem;color:var(--cit-text);font-weight:600;}
.helpline{background:linear-gradient(135deg,#FFF8E8,#FFF);border:1px solid var(--cit-saffron);border-radius:12px;padding:16px;margin-top:18px;text-align:center;}
.helpline .num{font-family:var(--font-mono);font-size:1.6rem;font-weight:700;color:var(--cit-saffron);letter-spacing:0.04em;}
.helpline .lbl{font-size:0.78rem;color:var(--cit-mute);text-transform:uppercase;letter-spacing:0.08em;margin-top:4px;}
</style>
</head>
<body>
<div class="app-shell">
  <div id="citizenTopbar"></div>
  <div class="page">

    <div class="page-head">
      <div>
        <h2><i class="fa-solid fa-headset"></i> Contact Us</h2>
        <div class="sub">Reach the QR Nexus team for any queries or support.</div>
      </div>
      <a class="back-link" href="userhome.html"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="contact-card">
      <h2><i class="fa-solid fa-headset"></i> Get in touch</h2>
      <div class="info-row">
        <div class="ico"><i class="fa-solid fa-envelope"></i></div>
        <div class="body"><label>Email</label><span>support@qrnexus.app</span></div>
      </div>
      <div class="info-row">
        <div class="ico"><i class="fa-solid fa-globe"></i></div>
        <div class="body"><label>Project</label><span>QR Nexus Traffic System</span></div>
      </div>
      <div class="info-row">
        <div class="ico"><i class="fa-solid fa-clock"></i></div>
        <div class="body"><label>Support Hours</label><span>Mon–Fri, 9am–6pm IST</span></div>
      </div>
      <div class="info-row">
        <div class="ico"><i class="fa-solid fa-landmark"></i></div>
        <div class="body"><label>Ministry</label><span>Road Transport &amp; Highways, Govt of India</span></div>
      </div>

      <div class="helpline">
        <div class="num">📞 1800-XXX-XXXX</div>
        <div class="lbl">Toll-free National Helpline</div>
      </div>

      <div style="text-align:center;margin-top:18px;">
        <a class="back-link" href="userhome.html" style="background:transparent;border:none;box-shadow:none;"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="citizen-topbar.js"></script>
</body>
</html>
