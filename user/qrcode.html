<!DOCTYPE html>
<html>

<head>
    <title>MyQR Code Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            width: 80%;
            max-width: 600px;
            padding: 30px;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        #trafficDetails {
            margin-bottom: 20px;
            text-align: left;
            color: #ddd;
        }

        #trafficDetails ul {
            list-style: none;
            padding: 0;
        }

        #trafficDetails ul li {
            margin-bottom: 8px;
            font-size: 1rem;
        }

        #trafficDetails ul li strong {
            color: #fff;
        }

        #qrcode {
            margin: 30px auto;
            text-align: center;
        }

        #backButton {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            font-size: 1rem;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        #backButton:hover {
            background-color: #5a09b7;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>My Latest QR Code</h2>
        <div id="trafficDetails" style="display:none"></div>
        <div id="qrcode"></div>
        <a id="backButton" href="userhome.html">Back to Home</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDV_t61dDGMPNAxq9cNqeI-_s97Sxl6TdA",
            authDomain: "qr-nexus-81938.firebaseapp.com",
            databaseURL: "https://qr-nexus-81938-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qr-nexus-81938",
            storageBucket: "qr-nexus-81938.firebasestorage.app",
            messagingSenderId: "597878562208",
            appId: "1:597878562208:web:acaac02de0078f86e018c5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const encryptionKey = '66MXNJUNXTH'; //do not change this!!

        function decryptData(encryptedData, key) {
            try {
                const bytes = CryptoJS.AES.decrypt(encryptedData, key);
                const decrypted = bytes.toString(CryptoJS.enc.Utf8);
                return JSON.parse(decrypted);
            } catch (e) {
                console.error("Decryption error:", e);
                return null;
            }
        }

        function generateQRCode(text) {
            const qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = "";

            const qrcode = new QRCode(qrcodeDiv, {
                text: text,
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function fetchAndDisplayLastQrCode() {
            auth.onAuthStateChanged(function (user) {
                if (user) {
                    var userId = user.uid;
                    const lastQrCodeRef = db.ref(`users/${userId}/lastQrCodeData`);

                    lastQrCodeRef.once('value')
                        .then((snapshot) => {
                            const encryptedData = snapshot.val();

                            if (encryptedData) {
                                generateQRCode(encryptedData);
                            } else {
                                document.getElementById("qrcode").innerHTML = "<p>No QR code data found.</p>";
                            }
                        })
                        .catch((error) => {
                            console.error("Error fetching last QR code data: ", error);
                            document.getElementById("qrcode").innerHTML = "<p>Failed to fetch QR code data.</p>";
                        });
                } else {
                    alert('No user is signed in. Please sign in before accessing this page.');
                    window.location.href = 'loginpage.html';
                }
            });
        }

        window.onload = function () {
            fetchAndDisplayLastQrCode();
        };
        //spidyyyyy
    </script>
</body>

</html>
