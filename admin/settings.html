<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · QR Nexus Officer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="admin.css">
<style>
.email-display{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-radius:10px;
  background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.20);
  color:#fff;font-size:0.95rem;font-weight:500;word-break:break-all;
}
.email-display i{color:var(--neon-cyan);font-size:1.1rem;}
.account-card{
  background:linear-gradient(160deg, rgba(0,229,255,0.06), rgba(255,107,0,0.04));
  border:1px solid var(--console-line);border-radius:14px;padding:20px;margin-bottom:16px;
}
.account-card h3{color:#fff;font-size:1rem;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.account-card h3 i{color:var(--saffron);}
.station-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:10px;
  background:rgba(31,184,31,0.10);border:1px solid rgba(31,184,31,0.25);
  font-size:0.85rem;font-weight:600;color:var(--neon-green);
}
.station-pill .pulse-dot{width:8px;height:8px;background:var(--neon-green);border-radius:50%;box-shadow:0 0 0 3px rgba(31,184,31,0.2);animation:pulse 1.6s infinite;}
.station-pill.missing{background:rgba(255,71,87,0.10);border-color:rgba(255,71,87,0.25);color:var(--neon-red);}
.station-pill.missing .pulse-dot{background:var(--neon-red);box-shadow:0 0 0 3px rgba(255,71,87,0.2);animation:none;}
</style>
</head>
<body>
<div class="app-shell">
  <div id="adminTopbar"></div>
  <div class="page" style="max-width:560px;">

    <div class="page-head">
      <div>
        <h2><i class="fa-solid fa-sliders"></i> Settings</h2>
        <div class="sub">Manage your account and assigned station.</div>
      </div>
      <a class="back-link" href="adminhome.html"><i class="fa-solid fa-arrow-left"></i> Command Center</a>
    </div>

    <div class="account-card">
      <h3><i class="fa-solid fa-id-badge"></i> Account Info</h3>
      <div class="field">
        <label>Logged in as</label>
        <div class="email-display"><i class="fa-solid fa-circle-user"></i><span id="officerEmail">Loading…</span></div>
      </div>
      <div class="field">
        <label>Assigned Station</label>
        <div id="stationLine" class="station-pill"><span class="pulse-dot"></span><span>Loading station…</span></div>
      </div>
    </div>

    <div class="account-card">
      <h3><i class="fa-solid fa-key"></i> Change Password</h3>
      <div class="field"><label>Current Password</label>
        <input class="input" type="password" id="currentPw" placeholder="Enter current password">
      </div>
      <div class="field"><label>New Password</label>
        <input class="input" type="password" id="newPw" placeholder="Min 6 characters">
      </div>
      <div class="field"><label>Confirm New Password</label>
        <input class="input" type="password" id="confirmPw" placeholder="Repeat new password">
      </div>
      <div class="notice" id="pwMsg" style="display:none;"></div>
      <button class="btn btn-primary btn-block" onclick="changePassword()"><i class="fa-solid fa-arrows-rotate"></i> Update Password</button>
    </div>

    <div class="account-card">
      <h3><i class="fa-solid fa-envelope"></i> Reset Password via Email</h3>
      <p style="color:var(--console-mute);font-size:0.85rem;margin-bottom:12px;">Send a password reset link to your email if you've forgotten it.</p>
      <button class="btn btn-ghost btn-block" onclick="sendReset()"><i class="fa-solid fa-paper-plane"></i> Send Reset Email</button>
      <div class="notice" id="resetMsg" style="display:none;"></div>
    </div>

    <div class="account-card" style="border-color:rgba(255,71,87,0.25);background:linear-gradient(160deg, rgba(255,71,87,0.05), transparent);">
      <h3 style="color:var(--neon-red);"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</h3>
      <p style="color:var(--console-mute);font-size:0.85rem;margin-bottom:12px;">End your current session on this device.</p>
      <button class="btn btn-danger btn-block" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="admin-topbar.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDV_t61dDGMPNAxq9cNqeI-_s97Sxl6TdA",authDomain:"qr-nexus-81938.firebaseapp.com",databaseURL:"https://qr-nexus-81938-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"qr-nexus-81938",storageBucket:"qr-nexus-81938.firebasestorage.app",messagingSenderId:"597878562208",appId:"1:597878562208:web:acaac02de0078f86e018c5"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const adminEmails=["admin@gmail.com","admin@gmail.com"];

auth.onAuthStateChanged(user=>{
  if(!user||!user.emailVerified){window.location.href='../index.html';return;}
  if(!adminEmails.includes(user.email)){window.location.href='../index.html';return;}
  document.getElementById('officerEmail').textContent=user.email;
  loadStation();
});

function loadStation(){
  const u=auth.currentUser;
  db.ref('officers/'+u.uid+'/station').once('value').then(snap=>{
    const st=snap.val();
    const wrap=document.getElementById('stationLine');
    if(st){
      wrap.innerHTML='<span class="pulse-dot"></span><span>📍 '+st+'</span>';
    }else{
      wrap.classList.add('missing');
      wrap.innerHTML='<span class="pulse-dot"></span><span>⚠ No station assigned. <a href="adminhome.html" style="color:var(--neon-cyan);margin-left:6px;">Set on dashboard</a></span>';
    }
  });
}

function showMsg(id,text,type){
  const el=document.getElementById(id);
  el.innerHTML='<i class="fa-solid '+(type==='success'?'fa-circle-check':(type==='error'?'fa-circle-xmark':'fa-circle-info'))+'"></i>'+text;
  el.className='notice '+(type==='success'?'ok':(type==='error'?'err':''));
  el.style.display='flex';
  clearTimeout(el._tm);el._tm=setTimeout(()=>el.style.display='none',5000);
}

function changePassword(){
  const user=auth.currentUser;
  const curr=document.getElementById('currentPw').value;
  const newP=document.getElementById('newPw').value;
  const conf=document.getElementById('confirmPw').value;
  if(!curr||!newP||!conf){showMsg('pwMsg','Fill all password fields.','error');return;}
  if(newP.length<6){showMsg('pwMsg','New password must be at least 6 characters.','error');return;}
  if(newP!==conf){showMsg('pwMsg','New passwords do not match.','error');return;}
  const cred=firebase.auth.EmailAuthProvider.credential(user.email,curr);
  user.reauthenticateWithCredential(cred)
    .then(()=>user.updatePassword(newP))
    .then(()=>{showMsg('pwMsg','Password updated successfully!','success');document.getElementById('currentPw').value='';document.getElementById('newPw').value='';document.getElementById('confirmPw').value='';toast('Password updated','ok');})
    .catch(e=>{
      if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')showMsg('pwMsg','Current password is incorrect.','error');
      else showMsg('pwMsg',e.message,'error');
    });
}

function sendReset(){
  const user=auth.currentUser;
  auth.sendPasswordResetEmail(user.email)
    .then(()=>{showMsg('resetMsg','Reset email sent to '+user.email,'success');toast('Reset email sent','ok');})
    .catch(e=>showMsg('resetMsg',e.message,'error'));
}
</script>
</body>
</html>
