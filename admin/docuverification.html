<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Documents</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            width: 80%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .left-panel h1 {
            font-size: 2.5rem;
        }

        .left-panel p {
            margin-top: 10px;
            font-size: 1.2rem;
        }

        .left-panel img {
            width: 70%;
            max-width: 300px;
            margin-top: 20px;
        }

        .right-panel {
            flex: 1.2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: white;
            color: #333;
        }

        .right-panel h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        form label {
            font-size: 1rem;
            margin-bottom: 5px;
        }

        form input {
            width: 80%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: border-color ease-in-out .3s;
        }

        form input:hover,
        form input:focus {
            border-color: #6a11cb;
            outline: none;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            font-size: 1rem;
            text-align: center;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            width: 80%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #5a09b7;
            transform: scale(1.05);
        }

        #userData {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
            color: #333;
            text-align: left;
        }

        #userData h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        #userData p {
            margin-bottom: 8px;
        }

        .error-message {
            color: #d32f2f;
            font-size: 0.9rem;
            margin-top: -10px;
            margin-bottom: 15px;
            visibility: hidden;
            background-color: #ffcdd2;
            border-left: 4px solid #d32f2f;
            padding: 8px 12px;
            border-radius: 4px;
            width: 80%;
            text-align: left;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .error-message.visible {
            visibility: visible;
            opacity: 1;
        }

        #emailVerificationMessage {
            color: green;
            font-size: 1rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <h1>Document Verification</h1>
            <p>Verify user data with an OTP sent to their email.</p>
            <img src="https://assets.onecompiler.app/438fn5wds/438fj6nqq/Adobe%20Express%20-%20file.png"
                alt="Data Verification Illustration">
        </div>

        <div class="right-panel">
            <h2>User Verification</h2>
            <form id="emailForm">
                <label for="email">User Email:</label>
                <input type="email" id="email" placeholder="Enter user's email" required>
                <span class="error-message" id="email-error">Please enter a valid email.</span>
                <button type="button" onclick="sendOTP()">Send OTP</button>
            </form>

            <form id="otpForm" style="display: none;">
                <label for="otp">Enter OTP:</label>
                <input type="text" id="otp" placeholder="Enter OTP" required>
                <span class="error-message" id="otp-error">Incorrect OTP.</span>
                <button type="button" onclick="verifyOTP()">Verify OTP</button>
            </form>

            <div id="userData" style="display: none;">
                <h3>User Data:</h3>
                <p><strong>Email:</strong> <span id="displayEmail"></span></p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDV_t61dDGMPNAxq9cNqeI-_s97Sxl6TdA",
            authDomain: "qr-nexus-81938.firebaseapp.com",
            databaseURL: "https://qr-nexus-81938-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qr-nexus-81938",
            storageBucket: "qr-nexus-81938.firebasestorage.app",
            messagingSenderId: "597878562208",
            appId: "1:597878562208:web:acaac02de0078f86e018c5"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.database();

        let currentEmail = null;
        let correctOTP = null;

        function generateOTP() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        async function sendOTP() {
            const email = document.getElementById('email').value.trim();
            const emailError = document.getElementById('email-error');
            emailError.classList.remove('visible');

            if (!isValidEmail(email)) {
                emailError.textContent = 'Please enter a valid email address.';
                emailError.classList.add('visible');
                return;
            }
            currentEmail = email;
            correctOTP = generateOTP();

            console.log(`Simulating sending OTP ${correctOTP} to ${email}`);
            alert(`OTP sent to ${email} (Simulated: ${correctOTP})`);

            document.getElementById('emailForm').style.display = 'none';
            document.getElementById('otpForm').style.display = 'flex';
        }

        function verifyOTP() {
            const enteredOTP = document.getElementById('otp').value;
            const otpError = document.getElementById('otp-error');
            otpError.classList.remove('visible');

            if (enteredOTP === correctOTP) {
                console.log('OTP is correct!');
                fetchUserData(currentEmail);
            } else {
                otpError.textContent = 'Incorrect OTP.';
                otpError.classList.add('visible');
            }
        }

          function fetchUserData(email) {
            firebase.auth().onAuthStateChanged(function (user) {
                if (user) {
                    db.ref('users').orderByChild('email').equalTo(email).once('value')
                        .then(snapshot => {
                            if (snapshot.exists()) {
                                const userData = snapshot.val();
                                displayUserData(userData);
                            } else {
                                console.log("No data available for this email");
                                alert("No data available for this email");
                            }
                        })
                        .catch((error) => {
                            console.error("Error fetching user data:", error);
                            alert("Error fetching user data: " + error.message);
                        });
                } else {
                    alert('No user is signed in. Please sign in as an admin to perform this action.');
                    window.location.href = 'index.html';
                }
            });
        }
function displayUserData(userData) {
            const userDataDiv = document.getElementById('userData');
            const displayEmailSpan = document.getElementById('displayEmail');
            userDataDiv.innerHTML = "";
            if (userData) {
                for (const userId in userData) {
                    if (userData.hasOwnProperty(userId)) {
                        const user = userData[userId];
                        displayEmailSpan.textContent = user.email;

                        const ul = document.createElement('ul');
                        for (const key in user) {
                            if (user.hasOwnProperty(key)) {
                                const li = document.createElement('li');
                                li.textContent = `${key}: ${user[key]}`;
                                ul.appendChild(li);
                            }
                        }

                        userDataDiv.appendChild(ul);
                        userDataDiv.style.display = 'block';
                    }
                }
            } else {
                displayEmailSpan.textContent = 'User data not found.';
                userDataDiv.textContent = 'User data not found.';
                userDataDiv.style.display = 'block';
            }
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        //spidyyyyy
    </script>
</body>

</html>
